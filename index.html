<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puff Market</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; padding-bottom: 120px; }
    h1 { text-align: center; color: #00f2fe; margin-bottom: 20px; }
    .product { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .btn { background: #0088cc; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; }
    .cart-box { background: #1e1e1e; border-top: 2px solid #00f2fe; position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; text-align: center; }
    .pay-btn { background: #34c759; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; }
    input { width: 90%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #444; background: #2c2c2e; color: #fff; }
  </style>
</head>
<body>

  <h1>🛍️ Puff Market</h1>

  <div class="product">
    <div><strong>Puff Truskawka</strong><br><small>100 ⭐️</small></div>
    <button class="btn" onclick="addToCart('Puff Truskawka', 100)">+ Dodaj</button>
  </div>

  <div class="product">
    <div><strong>Puff Borówka</strong><br><small>100 ⭐️</small></div>
    <button class="btn" onclick="addToCart('Puff Borówka', 100)">+ Dodaj</button>
  </div>

  <div class="product">
    <div><strong>Dostawa (Paczkomat)</strong><br><small>30 ⭐️</small></div>
    <button class="btn" onclick="addToCart('Dostawa', 30)">+ Dodaj</button>
  </div>

  <div class="cart-box">
    <input type="text" id="address" placeholder="Wpisz kod Paczkomatu i tel...">
    <div style="margin-bottom: 8px;">Suma: <span id="total">0</span> ⭐️</div>
    <button class="pay-btn" onclick="checkout()">Zapłać w Gwiazdkach ⭐️</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // TUTAJ WKLEJ TOKEN Z BOTFATHERA
    const BOT_TOKEN = 'TUTAJ_WKLEJ_SWOJ_TOKEN_BOTFATHERA';

    let cart = [];
    let totalPrice = 0;

    function addToCart(name, price) {
      cart.push(name);
      totalPrice += price;
      document.getElementById('total').innerText = totalPrice;
    }

    async function checkout() {
      const address = document.getElementById('address').value;
      if (cart.length === 0) { alert('Koszyk jest pusty!'); return; }
      if (!address) { alert('Wpisz dane do wysyłki!'); return; }

      const invoiceData = {
        title: "Zamówienie Puff Market",
        description: "Zamówienie: " + cart.join(', ') + " | Adres: " + address,
        payload: "order_" + Date.now(),
        provider_token: "",
        currency: "XTR",
        prices: [{ label: "Zamówienie z dostawą", amount: totalPrice }]
      };

      try {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/createInvoiceLink`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(invoiceData)
        });
        const data = await res.json();
        if (data.ok) {
          tg.openInvoice(data.result, function(status) {
            if (status === 'paid') {
              alert('Opłacono! Zamówienie zostało przyjęte.');
              tg.close();
            }
          });
        } else {
          alert('Błąd: ' + data.description);
        }
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
